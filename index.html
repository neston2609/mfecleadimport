<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="MFEC LeadSync - Connect, transform and import leads to Genesys Cloud"
    />
    <title>MFEC LeadSync</title>
    <script>
      (() => {
        let theme;
        try {
          theme = localStorage.getItem("leadsync.theme");
        } catch {}
        theme =
          theme === "dark" || theme === "light"
            ? theme
            : window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
